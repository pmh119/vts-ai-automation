<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTS 자동화 소통 자유게시판 | VTS 업무자동화 공유 포털</title>
<meta name="description" content="전국 해양경찰 VTS 관제사들이 업무 자동화 소감, 피드백, 꿀팁을 자유롭게 나누는 공유 게시판">
<link rel="stylesheet" href="style.css">
<style>
  body { background: #f0f2f5; }
  
  .board-header {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
  }
  
  /* DB 설정 패널 */
  .db-settings-panel {
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 14px;
    font-size: 13px;
  }
  .db-settings-toggle {
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    text-decoration: underline;
  }
  .db-settings-toggle:hover { color: var(--accent); }
  
  .input-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .input-text {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 13px;
    outline: none;
  }
  .input-text:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
  
  .btn-save-setting {
    padding: 8px 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  .btn-save-setting:hover { background: var(--accent-hover); }

  /* 게시판 레이아웃 */
  .board-layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 24px;
  }
  @media (max-width: 900px) {
    .board-layout { grid-template-columns: 1fr; }
  }

  /* 글 목록 */
  .post-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .post-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .post-card:hover {
    box-shadow: var(--shadow);
  }
  .post-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .post-author {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    color: var(--text);
  }
  .post-author-icon {
    width: 20px;
    height: 20px;
    background: #e2e8f0;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
  }
  .post-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-top: 4px;
  }
  .post-body {
    font-size: 14.5px;
    color: #374151;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
  
  /* 버튼 액션 스타일 */
  .post-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-action {
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-weight: 600;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .btn-action.edit {
    background: #e0f2fe;
    color: #0284c7;
    border-color: #bae6fd;
  }
  .btn-action.edit:hover { background: #bae6fd; }
  
  .btn-action.delete {
    background: #fee2e2;
    color: #ef4444;
    border-color: #fca5a5;
  }
  .btn-action.delete:hover { background: #fecaca; }

  /* 인라인 수정 폼 */
  .edit-form-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-top: 10px;
  }
  .edit-form-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }

  /* 댓글 섹션 */
  .comments-section {
    margin-top: 16px;
    border-top: 1px dashed var(--border);
    padding-top: 16px;
  }
  .comments-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .comment-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .comment-item {
    background: #f8fafc;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13.5px;
    border: 1px solid #f1f5f9;
    position: relative;
  }
  .comment-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .comment-author-info {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .comment-author {
    font-weight: 700;
    color: var(--text);
  }
  .comment-content {
    color: #374151;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .btn-comment-delete {
    padding: 2px 6px;
    background: #ffffff;
    color: #94a3b8;
    border: 1px solid #e2e8f0;
    border-radius: 4px;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-comment-delete:hover {
    background: #fee2e2;
    color: #ef4444;
    border-color: #fca5a5;
  }

  /* 댓글 작성 폼 */
  .comment-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
  }
  .comment-form-row {
    display: flex;
    gap: 8px;
  }
  .comment-form-row input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    outline: none;
  }
  .comment-form-row input:focus { border-color: var(--accent); }
  .comment-form-textarea {
    resize: none;
    height: 56px;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 13px;
    outline: none;
    font-family: var(--font);
  }
  .comment-form-textarea:focus { border-color: var(--accent); }
  .btn-submit-comment {
    align-self: flex-end;
    padding: 6px 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-submit-comment:hover { background: var(--accent-hover); }

  /* 글 쓰기 폼 */
  .write-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 90px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .write-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-group label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .form-input {
    padding: 10px 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    outline: none;
    font-family: var(--font);
  }
  .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
  .form-textarea {
    resize: none;
    height: 140px;
  }
  .btn-submit-post {
    padding: 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
    text-align: center;
  }
  .btn-submit-post:hover { background: var(--accent-hover); }

  /* 비밀번호 입력 모달 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-box {
    background: white;
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 340px;
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    gap: 16px;
    transform: scale(0.9);
    transition: transform 0.2s ease;
  }
  .modal-overlay.active .modal-box {
    transform: scale(1);
  }
  .modal-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }
  .btn-modal {
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-strong);
  }
  .btn-modal.confirm { background: #ef4444; color: white; border-color: #ef4444; }
  .btn-modal.confirm:hover { background: #dc2626; }
  .btn-modal.cancel { background: #f1f5f9; color: var(--text-muted); }
  .btn-modal.cancel:hover { background: #e2e8f0; }

  /* 안내 배지 */
  .status-badge {
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    line-height: 1.5;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<nav class="top-nav">
  <a class="nav-back" href="index.html">📁 메인 목록으로</a>
  <span class="nav-title">VTS 업무 자동화 자유게시판</span>
</nav>

<div class="hero" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #ffffff; padding: 50px 24px; border-radius: 16px; margin: 32px auto 20px; max-width: 1100px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
  <span class="hero-label" style="background: #334155; color: #cbd5e1; border: 1px solid #475569; margin-bottom: 16px;">💬 소통 & 노하우 공유</span>
  <h1 style="color: #ffffff;">VTS 자유 소통 게시판</h1>
  <p style="color: #cbd5e1; max-width: 700px;">전국 VTS 관제사들이 업무 자동화에 대한 소감, 개량 제안, 신규 아이디어를 자유롭게 공유하는 공간입니다.</p>
</div>

<div class="page-content" style="max-width: 1100px;">

  <div class="board-layout">
    
    <!-- 왼쪽: 게시글 목록 -->
    <div>
      <div class="post-list" id="post-list-container">
        <!-- 동적 렌더링 -->

    <!-- 오른쪽: 글쓰기 폼 -->
    <div>
      <div class="write-card">
        <div class="write-title">
          <span>📝 새 글 남기기</span>
        </div>
        <p style="font-size: 11px; color:#9ca3af; margin-top:-8px;">* 망 안전을 위해 파일 업로드는 비활성화되어 있으며, 텍스트 글만 작성이 가능합니다.</p>
        
        <div class="form-group">
          <label for="post-author-input">작성자 (관제실/성명)</label>

        <div class="form-group">
          <label for="post-pw-input">글 비밀번호 (수정/삭제용)</label>
          <input type="password" id="post-pw-input" class="form-input" placeholder="4자리 숫자 권장 (*관리자는 5688)">
        </div>
        
        <div class="form-group">
          <label for="post-title-input">제목</label>
          <input type="text" id="post-title-input" class="form-input" placeholder="글 제목을 작성해 주세요.">
        </div>
        
        <div class="form-group">
          <label for="post-content-input">내용</label>
          <textarea id="post-content-input" class="form-input form-textarea" placeholder="업무 자동화 활용기, 불편 사항, 버그 보고 등 자유롭게 남겨 주세요."></textarea>
        </div>
        
        <button class="btn-submit-post" onclick="submitPost()">게시물 등록</button>
      </div>
    </div>

  </div>

</div>

<!-- 삭제용 비밀번호 확인 모달 -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-box">
    <div class="modal-title" id="delete-modal-title">🔐 삭제 비밀번호 확인</div>
    <p style="font-size: 13px; color: var(--text-muted); line-height: 1.5;">작성 시 지정한 비밀번호를 입력해 주세요.</p>
    <input type="password" id="delete-pw-input" class="form-input" placeholder="비밀번호 입력">
    <div class="modal-buttons">
      <button class="btn-modal cancel" onclick="closeDeleteModal()">취소</button>
      <button class="btn-modal confirm" onclick="confirmDelete()">삭제하기</button>
    </div>
  </div>
</div>

<div class="page-footer" style="margin-top: 60px;">
  <p>해양경찰 VTS 업무자동화 실무 적용 사례 공유방</p>
</div>

<script>
// 데모(임시) 모드용 더미 포스트 배열
const defaultDemoPosts = [];

// 로컬 스토리지 키 정의
const GAS_URL_KEY = "vts_board_gas_url";
const LOCAL_POSTS_KEY = "vts_board_local_posts";

let currentGasUrl = "";
let activeDeleteId = null;
let activeDeleteType = "post"; // "post" or "comment"

// 초기화
window.onload = function() {
  // 1. 연동 URL 로드
  currentGasUrl = localStorage.getItem(GAS_URL_KEY);
  const newUrl = "https://script.google.com/macros/s/AKfycbysXw8R0fn9v_5cB2cumZFqJVICOtzkYiwUoBJ0GNuJqWeafmiNsW1RAVToS0pucbyF5g/exec";
  
  const oldUrls = [
    "https://script.google.com/macros/s/AKfycbwKqhgFQHvMiohJkQq6xDkoNJ_FpRmH_DbmQLfZPczs1XkrmF1sdJmU12lo-IwsD_wKLg/exec",
    "https://script.google.com/macros/s/AKfycbwrP24WpwAflgMMxLDqbf0Kb23pSTtRls0YcEOcYCRd2s9uFj6obkxCJo_MdI40toPzlA/exec"
  ];
  
  if (!currentGasUrl || oldUrls.includes(currentGasUrl)) {
    currentGasUrl = newUrl;
    localStorage.setItem(GAS_URL_KEY, currentGasUrl);
  }
  
  loadPosts();
};

// 글 불러오기
function loadPosts() {
  const container = document.getElementById("post-list-container");
  container.innerHTML = `<p style="text-align:center; color:#9ca3af; padding:40px 0;">게시글을 불러오는 중입니다...</p>`;
  
  if (currentGasUrl) {
    // 1. 구글 스프레드시트(GAS) 연동 로드
    fetch(currentGasUrl)
      .then(res => res.json())
      .then(data => {
        if (data.success && data.posts) {
          renderPosts(data.posts);
        } else {
          showError("데이터를 가져오는 중 오류가 발생했습니다: " + (data.error || "알 수 없는 에러"));
        }
      })
      .catch(err => {
        showError("구글 스프레드시트 서버 통신 실패. URL 확인 또는 CORS 허용 여부를 검토하세요.<br>오류내용: " + err.message);
      });
  } else {
    // 2. 데모 모드 로드 (LocalStorage)
    let localPosts = JSON.parse(localStorage.getItem(LOCAL_POSTS_KEY)) || [];
    renderPosts(localPosts);
  }
}

function showError(msg) {
  const container = document.getElementById("post-list-container");
  container.innerHTML = `
    <div style="background:#fef2f2; border:1px solid #fca5a5; padding:16px; border-radius:8px; color:#991b1b; font-size:13px; line-height:1.6;">
      ❌ <strong>연동 실패:</strong> ${msg}
    </div>
  `;
}

// 게시글 화면에 그리기
function renderPosts(posts) {
  const container = document.getElementById("post-list-container");
  container.innerHTML = "";
  
  if (posts.length === 0) {
    container.innerHTML = `<p style="text-align:center; color:#9ca3af; padding:80px 0; font-size:14px;">등록된 게시글이 없습니다. 첫 의견을 남겨보세요!</p>`;
    return;
  }
  
  posts.forEach(post => {
    const card = document.createElement("div");
    card.className = "post-card";
    card.id = `post-${post.id}`;
    
    const initial = post.author ? post.author.substring(0, 1) : "👤";
    
    // 댓글 목록 HTML 빌드
    let commentsHtml = "";
    if (post.comments && post.comments.length > 0) {
      post.comments.forEach(comment => {
        commentsHtml += `
          <div class="comment-item">
            <div class="comment-meta">
              <span class="comment-author-info">
                <span class="comment-author">${escapeHtml(comment.author)}</span>
                <span>📅 ${comment.date}</span>
              </span>
              <button class="btn-comment-delete" onclick="openDeleteModal('${comment.id}', 'comment')">삭제</button>
            </div>
            <div class="comment-content">${escapeHtml(comment.content)}</div>
          </div>
        `;
      });
    } else {
      commentsHtml = `<p style="font-size: 12px; color: #94a3b8; text-align: center; padding: 10px 0;">작성된 댓글이 없습니다.</p>`;
    }
    
    card.innerHTML = `
      <div id="post-view-content-${post.id}">
        <div class="post-meta">
          <span class="post-author">
            <span class="post-author-icon">${initial}</span>
            ${escapeHtml(post.author)}
          </span>
          <div style="display:flex; align-items:center; gap:12px;">
            <span>📅 ${post.date}</span>
            <div class="post-actions">
              <button class="btn-action edit" onclick="toggleEditMode('${post.id}', '${escapeJs(post.title)}', '${escapeJs(post.content)}')">수정</button>
              <button class="btn-action delete" onclick="openDeleteModal('${post.id}', 'post')">삭제</button>
            </div>
          </div>
        </div>
        <h3 class="post-title">${escapeHtml(post.title)}</h3>
        <div class="post-body">${escapeHtml(post.content)}</div>
      </div>
      
      <!-- 수정 모드 컨테이너 (기본 비활성) -->
      <div id="post-edit-container-${post.id}" style="display:none;">
        <div class="edit-form-container">
          <div class="edit-form-title">✏️ 게시물 수정</div>
          <div class="form-group">
            <label>제목</label>
            <input type="text" id="edit-title-${post.id}" class="form-input" value="${escapeHtml(post.title)}">
          </div>
          <div class="form-group">
            <label>내용</label>
            <textarea id="edit-content-${post.id}" class="form-input form-textarea">${escapeHtml(post.content)}</textarea>
          </div>
          <div class="form-group" style="max-width: 200px;">
            <label>비밀번호</label>
            <input type="password" id="edit-password-${post.id}" class="form-input" placeholder="수정 비밀번호 입력">
          </div>
          <div class="modal-buttons" style="margin-top: 10px;">
            <button class="btn-modal cancel" onclick="toggleEditMode('${post.id}')">취소</button>
            <button class="btn-modal confirm" style="background:var(--accent); border-color:var(--accent);" onclick="submitEdit('${post.id}')">저장하기</button>
          </div>
        </div>
      </div>
      
      <!-- 댓글 섹션 -->
      <div class="comments-section">
        <div class="comments-title">
          💬 댓글 ${post.comments ? post.comments.length : 0}개
        </div>
        <div class="comment-list">
          ${commentsHtml}
        </div>
        
        <!-- 댓글 쓰기 폼 -->
        <div class="comment-form">
          <div class="comment-form-row">
            <input type="text" id="comment-author-${post.id}" placeholder="작성자(관제실/이름)">
            <input type="password" id="comment-password-${post.id}" placeholder="비밀번호 (*관리자 5688)">
          </div>
          <textarea id="comment-content-${post.id}" class="comment-form-textarea" placeholder="댓글 내용을 적어주세요."></textarea>
          <button class="btn-submit-comment" onclick="submitComment('${post.id}')">댓글 등록</button>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// 작성자명이 '관리자' 일 때 패스워드 검증
function checkAdminPassword(author, password) {
  if (author.trim() === '관리자') {
    if (password.trim() !== '5688') {
      alert("작성자명이 '관리자'일 경우 비밀번호는 '5688'이어야 합니다.");
      return false;
    }
  }
  return true;
}

// 글 등록하기
function submitPost() {
  const author = document.getElementById("post-author-input").value.trim();
  const password = document.getElementById("post-pw-input").value.trim();
  const title = document.getElementById("post-title-input").value.trim();
  const content = document.getElementById("post-content-input").value.trim();
  
  if (!author || !password || !title || !content) {
    alert("작성자, 비밀번호, 제목, 내용을 빠짐없이 입력해 주세요.");
    return;
  }
  
  if (!checkAdminPassword(author, password)) {
    return;
  }
  
  if (currentGasUrl) {
    const payload = {
      action: "add",
      author: author,
      password: password,
      title: title,
      content: content
    };
    
    fetch(currentGasUrl, {
      method: "POST",
      body: JSON.stringify(payload)
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          clearForm();
          loadPosts();
          alert("글이 성공적으로 등록되었습니다!");
        } else {
          alert("글 등록 오류: " + data.error);
        }
      })
      .catch(err => {
        alert("서버 전송 실패: " + err.message);
      });
  } else {
    // 로컬 스토리지 추가 (데모)
    const today = new Date();
    const formatDate = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
    
    const newPost = {
      id: "local-" + today.getTime(),
      author: author,
      title: title,
      content: content,
      date: formatDate,
      password: password,
      hasPassword: true,
      comments: []
    };
    
    let localPosts = JSON.parse(localStorage.getItem(LOCAL_POSTS_KEY)) || [];
    localPosts.unshift(newPost);
    localStorage.setItem(LOCAL_POSTS_KEY, JSON.stringify(localPosts));
    
    clearForm();
    loadPosts();
    alert("임시 데모 등록이 완료되었습니다!");
  }
}

function clearForm() {
  document.getElementById("post-author-input").value = "";
  document.getElementById("post-pw-input").value = "";
  document.getElementById("post-title-input").value = "";
  document.getElementById("post-content-input").value = "";
}

// 수정 모드 토글
function toggleEditMode(postId, currentTitle = '', currentContent = '') {
  const viewDiv = document.getElementById(`post-view-content-${postId}`);
  const editDiv = document.getElementById(`post-edit-container-${postId}`);
  
  if (editDiv.style.display === "none") {
    viewDiv.style.display = "none";
    editDiv.style.display = "block";
    document.getElementById(`edit-password-${postId}`).value = "";
  } else {
    viewDiv.style.display = "block";
    editDiv.style.display = "none";
  }
}

// 글 수정 서버 전송
function submitEdit(postId) {
  const title = document.getElementById(`edit-title-${postId}`).value.trim();
  const content = document.getElementById(`edit-content-${postId}`).value.trim();
  const password = document.getElementById(`edit-password-${postId}`).value.trim();
  
  if (!title || !content || !password) {
    alert("제목, 내용, 비밀번호를 입력해 주세요.");
    return;
  }
  
  if (currentGasUrl) {
    const payload = {
      action: "edit",
      id: postId,
      title: title,
      content: content,
      password: password
    };
    
    fetch(currentGasUrl, {
      method: "POST",
      body: JSON.stringify(payload)
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          toggleEditMode(postId);
          loadPosts();
          alert("글이 성공적으로 수정되었습니다.");
        } else {
          alert("수정 오류: " + data.error);
        }
      })
      .catch(err => {
        alert("수정 요청 실패: " + err.message);
      });
  } else {
    // 로컬 데모 모드 수정
    let localPosts = JSON.parse(localStorage.getItem(LOCAL_POSTS_KEY)) || [];
    const postIdx = localPosts.findIndex(p => p.id === postId);
    
    if (postIdx >= 0) {
      const post = localPosts[postIdx];
      // 관리자 글일 경우 비밀번호 5688 검사
      if (post.author === '관리자' && password !== '5688') {
        alert("관리자 작성글 수정 시 비밀번호는 5688이어야 합니다.");
        return;
      }
      
      if (post.password === password) {
        post.title = title;
        post.content = content;
        localStorage.setItem(LOCAL_POSTS_KEY, JSON.stringify(localPosts));
        toggleEditMode(postId);
        loadPosts();
        alert("수정되었습니다.");
      } else {
        alert("비밀번호가 일치하지 않습니다.");
      }
    } else {
      alert("포스트를 찾을 수 없습니다.");
    }
  }
}

// 댓글 등록
function submitComment(postId) {
  const author = document.getElementById(`comment-author-${postId}`).value.trim();
  const password = document.getElementById(`comment-password-${postId}`).value.trim();
  const content = document.getElementById(`comment-content-${postId}`).value.trim();
  
  if (!author || !password || !content) {
    alert("작성자, 비밀번호, 댓글 내용을 모두 입력하세요.");
    return;
  }
  
  if (!checkAdminPassword(author, password)) {
    return;
  }
  
  if (currentGasUrl) {
    const payload = {
      action: "addComment",
      postId: postId,
      author: author,
      password: password,
      content: content
    };
    
    fetch(currentGasUrl, {
      method: "POST",
      body: JSON.stringify(payload)
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById(`comment-author-${postId}`).value = "";
          document.getElementById(`comment-password-${postId}`).value = "";
          document.getElementById(`comment-content-${postId}`).value = "";
          loadPosts();
        } else {
          alert("댓글 등록 실패: " + data.error);
        }
      })
      .catch(err => {
        alert("댓글 요청 실패: " + err.message);
      });
  } else {
    // 로컬 데모 모드 댓글
    let localPosts = JSON.parse(localStorage.getItem(LOCAL_POSTS_KEY)) || [];
    const postIdx = localPosts.findIndex(p => p.id === postId);
    
    if (postIdx >= 0) {
      const today = new Date();
      const formatDate = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
      
      const newComment = {
        id: "comment-" + today.getTime(),
        postId: postId,
        author: author,
        password: password,
        content: content,
        date: formatDate,
        hasPassword: true
      };
      
      if (!localPosts[postIdx].comments) {
        localPosts[postIdx].comments = [];
      }
      localPosts[postIdx].comments.push(newComment);
      localStorage.setItem(LOCAL_POSTS_KEY, JSON.stringify(localPosts));
      loadPosts();
    }
  }
}

// 삭제 모달 활성화
function openDeleteModal(id, type = "post") {
  activeDeleteId = id;
  activeDeleteType = type;
  
  document.getElementById("delete-pw-input").value = "";
  if (type === "post") {
    document.getElementById("delete-modal-title").innerText = "🔐 글 삭제 비밀번호 확인";
  } else {
    document.getElementById("delete-modal-title").innerText = "🔐 댓글 삭제 비밀번호 확인";
  }
  
  document.getElementById("delete-modal").classList.add("active");
  document.getElementById("delete-pw-input").focus();
}

function closeDeleteModal() {
  document.getElementById("delete-modal").classList.remove("active");
  activeDeleteId = null;
}

// 통합 삭제 수행
function confirmDelete() {
  const password = document.getElementById("delete-pw-input").value.trim();
  if (!password) {
    alert("비밀번호를 입력해 주세요.");
    return;
  }
  
  if (currentGasUrl) {
    const payload = {
      action: activeDeleteType === "post" ? "delete" : "deleteComment",
      password: password
    };
    if (activeDeleteType === "post") {
      payload.id = activeDeleteId;
    } else {
      payload.commentId = activeDeleteId;
    }
    
    fetch(currentGasUrl, {
      method: "POST",
      body: JSON.stringify(payload)
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          closeDeleteModal();
          loadPosts();
          alert("삭제 완료되었습니다.");
        } else {
          alert("삭제 오류: " + data.error);
        }
      })
      .catch(err => {
        alert("삭제 요청 실패: " + err.message);
      });
  } else {
    // 로컬 데모 모드 삭제
    let localPosts = JSON.parse(localStorage.getItem(LOCAL_POSTS_KEY)) || [];
    
    if (activeDeleteType === "post") {
      const targetPost = localPosts.find(p => p.id === activeDeleteId);
      if (targetPost) {
        if (targetPost.author === '관리자' && password !== '5688') {
          alert("관리자 작성글 삭제 시 비밀번호는 5688이어야 합니다.");
          return;
        }
        if (targetPost.password === password) {
          localPosts = localPosts.filter(p => p.id !== activeDeleteId);
          localStorage.setItem(LOCAL_POSTS_KEY, JSON.stringify(localPosts));
          closeDeleteModal();
          loadPosts();
          alert("글이 삭제되었습니다.");
        } else {
          alert("비밀번호가 일치하지 않습니다.");
        }
      }
    } else {
      // 댓글 삭제
      let done = false;
      for (let i = 0; i < localPosts.length; i++) {
        if (localPosts[i].comments) {
          const targetComment = localPosts[i].comments.find(c => c.id === activeDeleteId);
          if (targetComment) {
            if (targetComment.author === '관리자' && password !== '5688') {
              alert("관리자 댓글 삭제 시 비밀번호는 5688이어야 합니다.");
              return;
            }
            if (targetComment.password === password) {
              localPosts[i].comments = localPosts[i].comments.filter(c => c.id !== activeDeleteId);
              localStorage.setItem(LOCAL_POSTS_KEY, JSON.stringify(localPosts));
              done = true;
              break;
            }
          }
        }
      }
      if (done) {
        closeDeleteModal();
        loadPosts();
        alert("댓글이 삭제되었습니다.");
      } else {
        alert("비밀번호가 일치하지 않거나 대상을 찾을 수 없습니다.");
      }
    }
  }
}

// XSS 방어 문자 필터링
function escapeHtml(str) {
  if (!str) return "";
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// JS string escape 헬퍼
function escapeJs(str) {
  if (!str) return "";
  return str
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r');
}
